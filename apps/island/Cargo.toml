[package]
name = "island"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-All-Rights-Reserved"
description = "Maer-Ken Island: dashboard with the Human Creator"

[[bin]]
name = "island"
path = "src/main.rs"

# The population's own CLI (founders, create), from the retired
# apps/island_humans crate (Phase 5 Task 7).
[[bin]]
name = "island_humans"
path = "src/bin/island_humans.rs"

[[bin]]
name = "island_bench"
path = "src/bin/island_bench.rs"

[dependencies]
# For the island's map. `island_preview` already renders this island's
# elevation and coastline for the headless galleries; the dashboard draws
# the same picture rather than growing a second renderer beside it.
island_preview = { path = "../island_preview" }
mk_core = { path = "../../crates/mk_core" }
mk_engine = { path = "../../crates/mk_engine" }
mk_island = { path = "../../crates/mk_island" }
# The wire schema. One definition of every shape that crosses the
# network, shared with every frontend that reads it.
mk_island_api = { path = "../../crates/mk_island_api" }
# The client is tested against this server rather than against a mock:
# every bug worth catching is a disagreement between the two.
mk_island_client = { path = "../../crates/mk_island_client" }
mk_interventions = { path = "../../crates/mk_interventions" }
bytes = "1"
# Terrain for a 3D client is 5.8 MB of grid; it deflates hard and is
# built once, so the backend holds it gzipped as well as raw.
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
# island_bench compares one thread against the pool.
rayon.workspace = true
hex.workspace = true
chrono.workspace = true
warp.workspace = true
tokio.workspace = true

[dev-dependencies]
warp = { workspace = true, features = ["test"] }
mk_island_api = { path = "../../crates/mk_island_api" }
# The client is tested against this server rather than against a mock:
# every bug worth catching is a disagreement between the two.
mk_island_client = { path = "../../crates/mk_island_client" }
tempfile = "3"

[lints]
workspace = true
