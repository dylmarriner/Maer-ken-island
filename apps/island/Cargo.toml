[package]
name = "island"
version = "0.1.0"
edition = "2021"
description = "Maer-Ken Island: dashboard with the Human Creator"

[lib]
name = "island_runner"
path = "src/runner.rs"

[[bin]]
name = "island"
path = "src/main.rs"

[[bin]]
name = "island_bench"
path = "src/bin/island_bench.rs"

[dependencies]
island_humans = { path = "../island_humans" }
mk_engine = { path = "../../crates/mk_engine" }
mk_interventions = { path = "../../crates/mk_interventions" }
mk_core = { path = "../../crates/mk_core" }
mk_island = { path = "../../crates/mk_island" }
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
hex.workspace = true
warp.workspace = true
tokio.workspace = true

[dev-dependencies]
warp = { workspace = true, features = ["test"] }
tempfile = "3"

[lints]
workspace = true
