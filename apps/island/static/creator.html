<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human Creator</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Maer-Ken Island</h1>
  <nav><a href="/">People</a><a href="/creator" aria-current="page">Create a human</a></nav>
</header>
<main>
  <p class="status" id="writes">Checking write access…</p>
  <section class="panel">
    <form id="creator" novalidate>
      <label class="full">Name<input name="name" required maxlength="120" autocomplete="off"></label>
      <label>Biological sex<select name="biological_sex" required></select></label>
      <label>Birth (date and time)<input name="birth_local" type="datetime-local" required></label>
      <label>UTC offset<input name="birth_offset" value="+13:00" pattern="[+-]\d\d:\d\d" required></label>
      <label>Age (years)<input name="age_years" type="number" step="0.1" min="0" required></label>
      <label>Birth latitude<input name="birth_latitude" type="number" step="0.0001" min="-90" max="90" value="-41.3" required></label>
      <label>Birth longitude<input name="birth_longitude" type="number" step="0.0001" min="-180" max="180" value="174.8" required></label>
      <label>Height (cm)<input name="height_cm" type="number" step="0.5" value="170" required></label>
      <label>Build<select name="build" required></select></label>
      <label>Hair<select name="hair_color" required></select></label>
      <label>Eyes<select name="eye_color" required></select></label>
      <label>Skin<select name="skin_tone" required></select></label>
      <label class="full">Control token (only if the server was started with ISLAND_CONTROL_TOKEN; kept for this tab only)
        <input name="token" type="password" autocomplete="off"></label>
      <button class="primary" type="submit" id="submit">Create</button>
      <div class="full" id="result" aria-live="polite"></div>
    </form>
  </section>
</main>
<script src="/static/creator.js"></script>
</body>
</html>
