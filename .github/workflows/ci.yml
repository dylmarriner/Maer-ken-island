name: CI

on:
  # `push` is deliberately limited to the default branch. Before this, a
  # bare `push:` alongside `pull_request:` meant every push to a PR branch
  # started CI *twice* on the same commit — two full fmt + clippy +
  # `cargo test --workspace` runs of 18-28 minutes each, for identical
  # work. (Proof, on f63ab04: run #92 `event: push` and run #93
  # `event: pull_request`, same `head_sha`.) This repository is private, so
  # those are billable minutes, and half of them bought nothing.
  #
  # The trade: a push to a branch with no pull request open no longer runs
  # CI. Work here reaches `main` through a pull request, so that branch is
  # covered by the `pull_request` event from the moment one is opened.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly slow tier, 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  check:
    name: fmt, clippy, fast tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fast tests
        run: cargo test --workspace

  slow:
    name: slow tests (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Slow tests
        run: cargo test --workspace --release -- --ignored slow_
