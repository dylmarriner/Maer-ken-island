[workspace]
members = [
    "crates/mk_core",
    "crates/mk_engine",
    "crates/mk_interventions",
    "crates/mk_island",
    "apps/island_humans",
    "apps/island",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
bincode = "1.3"
blake3 = "1.5"
rand = "0.8"
rand_chacha = "0.3"
rand_core = "0.6"
aes-gcm = "0.10"
aead = "0.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
warp = { version = "0.4", features = ["server"] }
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
png = "0.17"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# The simulation crates are numeric and loop-heavy; optimising them keeps the
# fast test tier fast without slowing compiles of the rest of the workspace.
[profile.dev.package.mk_engine]
opt-level = 2

[profile.dev.package.mk_core]
opt-level = 2

# `cargo test --release` uses the bench profile, which would otherwise inherit
# the release `lto = true, codegen-units = 1` and make every test binary slow
# to link.
[profile.bench]
lto = false
codegen-units = 16

[workspace.lints.cargo]
non_kebab_case_bins = "allow"
missing_lints_inheritance = "allow"
unused_dependencies = "allow"
